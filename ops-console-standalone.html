<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activation & Follow-up — Ops Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
/* ==================================================================
   ACTIVATION & FOLLOW-UP — OPS CONSOLE
   Visual identity: "fiber signal" console.
   Deep ink-navy base, one warm amber signal accent used sparingly,
   one cool teal used only to encode data intensity (heatmap),
   a small rotating palette used only to tag task groups.
   Headings in a technical grotesk, data in a mono telemetry face.
================================================================== */

:root{
  --bg:          #0a0e1a;
  --bg-grain:    #0c1120;
  --panel:       #10182a;
  --panel-2:     #141d33;
  --panel-raised:#182339;
  --border:      #212e4a;
  --border-soft: #19243c;
  --text:        #edf1fa;
  --text-dim:    #93a1bd;
  --text-faint:  #5b6787;

  --amber:       #ff9d3d;
  --amber-ink:   #1a1002;
  --amber-dim:   rgba(255,157,61,.14);
  --teal:        #2dd6c4;
  --violet:      #9b8cfb;
  --pink:        #f472b6;
  --blue:        #60a5fa;
  --green:       #34d399;
  --gold:        #f0c95a;

  --good:        #33d17a;
  --bad:         #ef5b6a;
  --warn:        #f0b429;

  --radius-sm:   8px;
  --radius:      12px;
  --radius-lg:   16px;

  --shadow-sm:   0 1px 2px rgba(0,0,0,.35);
  --shadow-md:   0 6px 20px -6px rgba(0,0,0,.55);
  --shadow-glow: 0 0 0 1px rgba(255,157,61,.12), 0 8px 24px -8px rgba(255,157,61,.18);

  --mono:    'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  --sans:    'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --display: 'Space Grotesk', var(--sans);

  --ease: cubic-bezier(.4,0,.2,1);
}

*{ box-sizing:border-box; }
::selection{ background:var(--amber); color:var(--amber-ink); }

html{ color-scheme:dark; }

body{
  margin:0;
  font-family:var(--sans);
  color:var(--text);
  line-height:1.55;
  background:
    radial-gradient(1100px 480px at 12% -8%, #16213f 0%, transparent 58%),
    radial-gradient(900px 460px at 102% 2%, #132038 0%, transparent 55%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-grain) 100%);
  min-height:100vh;
  padding:32px clamp(16px, 4vw, 40px) 72px;
  -webkit-font-smoothing:antialiased;
}

a{ color:var(--amber); }
:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; border-radius:4px; }

/* ---------- layout shell ---------- */
.shell{ max-width:1320px; margin:0 auto; }

/* ---------- header ---------- */
.topline{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
  border-bottom:1px solid var(--border-soft);
  padding-bottom:20px;
  margin-bottom:24px;
}

.brand h1{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(22px, 2.4vw, 28px);
  margin:0;
  letter-spacing:.1px;
}
.brand h1 .amp{ color:var(--amber); }

.brand .tagline{
  font-family:var(--display);
  font-size:13px;
  font-weight:500;
  color:var(--text-dim);
  margin-top:6px;
  letter-spacing:.2px;
}

.sync-pill{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:999px;
  padding:9px 16px 9px 12px;
  font-size:12.5px;
  color:var(--text-dim);
  max-width:460px;
  box-shadow:var(--shadow-sm);
}
.dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--text-faint);
  flex:none;
}
.sync-pill.ok{ border-color:rgba(51,209,122,.35); }
.sync-pill.ok .dot{ background:var(--good); box-shadow:0 0 0 4px rgba(51,209,122,.15); animation:pulse 2.2s infinite; }
.sync-pill.err{ border-color:rgba(239,91,106,.35); }
.sync-pill.err .dot{ background:var(--bad); }
.sync-pill.busy .dot{ background:var(--amber); animation:pulse 1s infinite; }

@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(51,209,122,.35); }
  70%{ box-shadow:0 0 0 7px rgba(51,209,122,0); }
  100%{ box-shadow:0 0 0 0 rgba(51,209,122,0); }
}
.sync-pill b{ color:var(--text); font-weight:600; }

/* ---------- toolbar ---------- */
.toolbar{
  background:linear-gradient(180deg, var(--panel-raised), var(--panel));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 20px;
  margin-bottom:24px;
  box-shadow:var(--shadow-sm);
}
.toolbar-row{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:flex-end;
}
.toolbar-row + .toolbar-row{
  margin-top:14px;
  padding-top:14px;
  border-top:1px dashed var(--border-soft);
}

.field{ display:flex; flex-direction:column; gap:6px; }
.field-label{
  font-size:11px;
  font-weight:500;
  color:var(--text-faint);
  letter-spacing:.15px;
}
.field-hint{
  font-size:11.5px;
  color:var(--text-faint);
  max-width:280px;
  line-height:1.4;
}

input[type=text], input[type=file], textarea{
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 12px;
  border-radius:var(--radius-sm);
  font-family:var(--sans);
  font-size:13.5px;
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
input[type=text]::placeholder, textarea::placeholder{ color:var(--text-faint); }
input[type=text]:focus, textarea:focus{
  outline:none;
  border-color:var(--amber);
  box-shadow:0 0 0 3px var(--amber-dim);
}
input[type=file]{ padding:8px 10px; font-size:12.5px; }
input[type=file]::file-selector-button{
  background:var(--panel-2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px 10px;
  margin-right:10px;
  font-family:var(--sans);
  font-size:12px;
  cursor:pointer;
}

#pasteArea{ width:100%; min-height:58px; resize:vertical; font-family:var(--mono); font-size:12px; }
#tabName{ width:120px; }
#searchInput{ width:230px; }

button{
  padding:10px 16px;
  cursor:pointer;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--panel-2);
  color:var(--text);
  font-family:var(--sans);
  font-weight:500;
  font-size:13px;
  transition:border-color .15s var(--ease), background .15s var(--ease), transform .1s var(--ease);
}
button:hover{ border-color:var(--text-faint); transform:translateY(-1px); }
button:active{ transform:translateY(0); }

button.primary{
  background:linear-gradient(180deg, #ffb15e, var(--amber));
  color:var(--amber-ink);
  border-color:transparent;
  font-weight:600;
  box-shadow:var(--shadow-glow);
}
button.primary:hover{ filter:brightness(1.05); }

button.ghost-danger{ color:var(--bad); }
button.ghost-danger:hover{ border-color:var(--bad); }
button.ghost-good{ color:var(--good); }
button.ghost-good:hover{ border-color:var(--good); }
button.subtle{
  background:transparent;
  border-color:transparent;
  color:var(--text-dim);
  font-size:12px;
  padding:7px 10px;
}
button.subtle:hover{ background:var(--panel-2); border-color:var(--border); }

/* ---------- KPI readout strip ---------- */
.readout{
  display:flex;
  background:linear-gradient(180deg, var(--panel-raised), var(--panel));
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:26px;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.readout .cell{
  flex:1;
  min-width:140px;
  padding:18px 22px;
  border-left:1px solid var(--border-soft);
}
.readout .cell:first-child{ border-left:none; }
.readout .num{
  font-family:var(--mono);
  font-size:clamp(22px, 2.6vw, 30px);
  font-weight:600;
  color:var(--amber);
  line-height:1;
  letter-spacing:-.5px;
}
.readout .cell:nth-child(2) .num{ color:var(--teal); }
.readout .cell:nth-child(3) .num{ color:var(--violet); }
.readout .cell:nth-child(4) .num{ color:var(--green); }
.readout .label{ font-size:12px; color:var(--text-dim); margin-top:7px; }

/* ---------- group summary table ---------- */
.table-wrap{
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:28px;
  background:var(--panel);
  box-shadow:var(--shadow-sm);
}
table.group-summary{ width:100%; border-collapse:collapse; font-size:13px; }
table.group-summary th{
  text-align:left;
  font-weight:500;
  color:var(--text-faint);
  font-size:11px;
  letter-spacing:.2px;
  padding:12px 14px;
  background:var(--panel-raised);
  border-bottom:1px solid var(--border);
}
table.group-summary td{
  padding:12px 14px;
  border-bottom:1px solid var(--border-soft);
  font-family:var(--mono);
}
table.group-summary tr:last-child td{ border-bottom:none; }
table.group-summary td.name-cell{ font-family:var(--sans); font-weight:600; }
table.group-summary tr{ transition:background .12s var(--ease); }
table.group-summary tr:hover td{ background:var(--panel-2); }

.swatch{
  display:inline-block;
  width:9px; height:9px;
  border-radius:3px;
  margin-right:9px;
  vertical-align:middle;
  box-shadow:0 0 8px currentColor;
}

/* ---------- group accordions ---------- */
details.group{
  background:var(--panel);
  border:1px solid var(--border);
  border-left-width:3px;
  border-radius:var(--radius);
  margin-bottom:14px;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .18s var(--ease);
}
details.group[open]{ box-shadow:var(--shadow-md); }

details.group > summary{
  list-style:none;
  cursor:pointer;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  font-family:var(--display);
  font-weight:600;
  font-size:15.5px;
  user-select:none;
}
details.group > summary::-webkit-details-marker{ display:none; }
details.group > summary::before{
  content:"▸";
  color:var(--text-faint);
  font-size:12px;
  transition:transform .18s var(--ease);
  width:10px;
}
details.group[open] > summary::before{ transform:rotate(90deg); color:var(--amber); }

details.group > summary .meta{
  margin-left:auto;
  font-family:var(--mono);
  font-size:12px;
  color:var(--text-dim);
  font-weight:400;
  display:flex;
  gap:18px;
}

.group-body{ padding:6px 20px 18px; }

details.leader{
  border-top:1px solid var(--border-soft);
  padding-top:14px;
  margin-top:14px;
}
details.leader:first-child{ border-top:none; margin-top:6px; padding-top:0; }
details.leader > summary{
  list-style:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  margin:0 -10px;
  border-radius:8px;
  font-size:13.5px;
  font-weight:600;
  user-select:none;
  transition:background .12s var(--ease);
}
details.leader > summary:hover{ background:var(--panel-2); }
details.leader > summary::-webkit-details-marker{ display:none; }
details.leader > summary::before{
  content:"›";
  color:var(--text-faint);
  display:inline-block;
  width:8px;
  transition:transform .18s var(--ease);
}
details.leader[open] > summary::before{ transform:rotate(90deg); }
details.leader > summary .crown{ filter:drop-shadow(0 0 4px rgba(240,201,90,.6)); }
details.leader > summary .lmeta{
  margin-left:auto;
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--text-dim);
  font-weight:400;
  display:flex;
  gap:14px;
}

.badge{
  font-size:9.5px;
  font-weight:600;
  padding:2px 7px;
  border-radius:5px;
  background:var(--amber-dim);
  color:var(--amber);
  font-family:var(--sans);
  letter-spacing:.2px;
}

/* ---------- user table w/ hour heatmap ---------- */
.agents-wrap{ overflow-x:auto; border-radius:var(--radius-sm); }
table.agents{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:12.5px;
}
table.agents th{
  text-align:center;
  font-weight:500;
  color:var(--text-faint);
  font-size:10.5px;
  padding:7px 5px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
table.agents th:first-child{ text-align:left; }
table.agents td{
  text-align:center;
  padding:7px 5px;
  border-bottom:1px solid var(--border-soft);
  font-family:var(--mono);
}
table.agents tr:last-child td{ border-bottom:none; }
table.agents td:first-child{
  text-align:left;
  font-family:var(--sans);
  font-weight:500;
  white-space:nowrap;
}
table.agents td.hour-cell{ border-radius:5px; color:var(--text-dim); }
table.agents td.hour-cell.hot{ color:#0a0e1a; font-weight:600; }
table.agents td.total{ font-weight:600; color:var(--text); }
table.agents td.points{ color:var(--amber); font-weight:600; }
table.agents td.reach-good{ color:var(--good); }
table.agents td.reach-bad{ color:var(--bad); }

.empty-state{
  text-align:center;
  color:var(--text-faint);
  padding:70px 20px;
  font-family:var(--display);
  font-size:14px;
  border:1px dashed var(--border);
  border-radius:var(--radius);
  background:var(--panel);
}
.empty-state .big{ font-size:15.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600; }

/* ---------- scrollbar polish ---------- */
::-webkit-scrollbar{ height:10px; width:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }

/* ---------- responsive ---------- */
@media (max-width: 760px){
  .toolbar-row{ align-items:stretch; }
  .field, #searchInput, #pasteArea{ width:100%; }
  .readout{ flex-wrap:wrap; }
  .readout .cell{ flex:1 1 45%; border-left:none; border-top:1px solid var(--border-soft); }
  .readout .cell:first-child{ border-top:none; }
  details.group > summary .meta, details.leader > summary .lmeta{
    flex-wrap:wrap;
    gap:8px;
    font-size:10.5px;
  }
}

</style>

<body>

<div class="shell">

  <div class="topline">
    <div class="brand">
      <h1>Activation <span class="amp">&</span> Follow-up</h1>
      <div class="tagline">"OWN The Case" — hourly performance by group · leader · agent</div>
    </div>
    <div id="syncPill" class="sync-pill">
      <div class="dot"></div>
      <span id="syncText">Not connected to the sheet yet</span>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-row">
      <div class="field">
        <label class="field-label" for="tabName">Str tab name</label>
        <input type="text" id="tabName" value="Str">
      </div>
      <button class="primary" onclick="syncMapping()">🔄 Sync mapping</button>
      <span class="field-hint">Reads column D (agent), F (task group), M (leader) from that tab.</span>
    </div>

    <div class="toolbar-row">
      <div class="field">
        <label class="field-label" for="fileInput">Upload ticket export (CSV)</label>
        <input type="file" id="fileInput">
      </div>
      <div class="field" style="flex:1;min-width:240px;">
        <label class="field-label" for="pasteArea">...or paste CSV</label>
        <textarea id="pasteArea" placeholder="Paste CSV rows here..."></textarea>
      </div>
      <div class="field">
        <label class="field-label" for="searchInput">Search agent</label>
        <input type="text" id="searchInput" placeholder="agent id / name">
      </div>
    </div>

    <div class="toolbar-row">
      <button class="primary" onclick="handlePaste()">▶ Process tickets</button>
      <button class="subtle" onclick="expandAll(true)">Expand all</button>
      <button class="subtle" onclick="expandAll(false)">Collapse all</button>
      <button class="ghost-good" onclick="copyAsImage()">📸 Copy as image</button>
      <button class="ghost-danger" onclick="resetData()">Reset</button>
    </div>
  </div>

  <div id="dashboard"></div>

</div>

<script>
/* ==================================================================
   ACTIVATION & FOLLOW-UP — OPS CONSOLE
   Logic: Google Sheet ("Str" tab) mapping sync + CSV ticket
   processing into an Hour x (Group > Leader > Agent) tree.
================================================================== */

/* ============================================================
   CONFIG
============================================================ */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbytna6gz9sE31tX_i00k1v9MAp9QyvKZwGYTao_r9B8qIVW1DcXUdyOl_Zb_kmcsFO2/exec";

// 0-indexed column positions inside the "Str" tab
const COL_USER   = 3;  // column D — agent id
const COL_GROUP  = 5;  // column F — task group
const COL_LEADER = 12; // column M — leader name

// coordinator IDs get a small badge next to their name
const COOR = ["AZ217162","AA138951","AS93748","KE144207","FA236380","MO222804","SM195261"];

const GROUP_PALETTE = ["#ff9d3d","#2dd6c4","#9b8cfb","#f472b6","#60a5fa","#34d399","#f0b429"];

/* ============================================================
   STATE
============================================================ */
let STR_MAP = {};      // { agentId: { group, leader } }
let RAW_ROWS = [];      // last parsed CSV rows (so we can re-run after a re-sync)
let GLOBAL_DATA = {};   // { group: { leader: { agent: stats } } }
let GLOBAL_HOURS = [];

/* ============================================================
   SHEET SYNC
============================================================ */
function setStatus(kind, text){
  const pill = document.getElementById('syncPill');
  pill.className = 'sync-pill ' + kind;
  document.getElementById('syncText').textContent = text;
}

async function syncMapping(){
  const tab = document.getElementById('tabName').value.trim() || 'Str';
  setStatus('busy', `Connecting to "${tab}"...`);
  try{
    const res = await fetch(`${SHEET_URL}?tab=${encodeURIComponent(tab)}`);
    const json = await res.json();
    if(json.status !== 'success') throw new Error(json.message || 'Unknown error from script');

    STR_MAP = {};
    json.data.forEach(record=>{
      const vals = Object.values(record);
      const user = (vals[COL_USER] ?? '').toString().trim();
      if(!user) return;
      const group = (vals[COL_GROUP] ?? '').toString().trim() || 'Unmapped';
      const leader = (vals[COL_LEADER] ?? '').toString().trim() || 'Unmapped';
      STR_MAP[user] = { group, leader };
    });

    const n = Object.keys(STR_MAP).length;
    setStatus('ok', `Synced — ${n} agents mapped from "${tab}" — ${new Date().toLocaleTimeString()}`);

    if(RAW_ROWS.length) process(RAW_ROWS); // re-run with fresh mapping if we already have tickets

  }catch(err){
    setStatus('err', `Couldn't reach the sheet (${err.message}) — falling back to the CSV's own added_by_leader column, grouped as "Unmapped"`);
  }
}

/* ============================================================
   LOAD TICKETS
============================================================ */
function resetData(){
  GLOBAL_DATA = {};
  GLOBAL_HOURS = [];
  RAW_ROWS = [];
  document.getElementById("dashboard").innerHTML = "";
  document.getElementById("pasteArea").value = "";
  document.getElementById("searchInput").value = "";
  renderFiltered();
}

function handlePaste(){
  Papa.parse(document.getElementById("pasteArea").value,{
    header:true,
    skipEmptyLines:true,
    complete: res => process(res.data)
  });
}

/* ============================================================
   PROCESS — build group -> leader -> agent tree
============================================================ */
function process(data){

  RAW_ROWS = data;
  GLOBAL_DATA = {};
  let hoursSet = new Set();

  data.forEach(r=>{

    const user = (r.added_by || "").toString().trim();
    if(!user) return;

    const action = (r.case_action || "").toString().trim();
    const status = (r.ticket_status || "").toString().trim();
    const hourDate = new Date(r.added_on);
    if(isNaN(hourDate.getTime())) return;
    const hour = hourDate.getHours();

    const mapped = STR_MAP[user];
    const leader = mapped ? mapped.leader : ((r.added_by_leader || "").trim() || "Unmapped");
    const group  = mapped ? mapped.group  : "Unmapped";

    if(!GLOBAL_DATA[group]) GLOBAL_DATA[group] = {};
    if(!GLOBAL_DATA[group][leader]) GLOBAL_DATA[group][leader] = {};
    if(!GLOBAL_DATA[group][leader][user]){
      GLOBAL_DATA[group][leader][user] = {
        hours:{}, total:0, reached:0, notReached:0, points:0
      };
    }

    const u = GLOBAL_DATA[group][leader][user];
    hoursSet.add(hour);
    u.hours[hour] = (u.hours[hour]||0) + 1;
    u.total++;

    if(action === "Reached") u.reached++;
    else if(action === "Not Reached - SMS Sent") u.notReached++;

    if(action === "Reached" && status === "New") u.points += 4;
    else if(action === "Reached") u.points += 3.5;
    else if(action === "Not Reached - SMS Sent") u.points += 3;
    else if(action.toLowerCase().includes("no call")) u.points += 1.5;

  });

  GLOBAL_HOURS = Array.from(hoursSet).sort((a,b)=>a-b);
  renderFiltered();
}

/* ============================================================
   HELPERS
============================================================ */
function groupColor(name){
  let h = 0;
  for(let i=0;i<name.length;i++) h = name.charCodeAt(i) + ((h<<5)-h);
  return GROUP_PALETTE[Math.abs(h) % GROUP_PALETTE.length];
}

function aggregate(obj){
  let total=0, reached=0, notReached=0, points=0;
  for(const k in obj){
    if(obj[k].total !== undefined){
      total += obj[k].total; reached += obj[k].reached;
      notReached += obj[k].notReached; points += obj[k].points;
    }
  }
  return {total, reached, notReached, points};
}

function reachPct(r,n){ return (r/(r+n)*100 || 0).toFixed(1); }

function expandAll(open){
  document.querySelectorAll('#dashboard details').forEach(d => d.open = open);
}

function flattenGroup(leaders){
  const flat = {};
  for(const l in leaders){
    for(const a in leaders[l]){
      flat[a] = leaders[l][a];
    }
  }
  return flat;
}

/* ============================================================
   RENDER
============================================================ */
function renderFiltered(){

  const search = document.getElementById("searchInput").value.toLowerCase();
  const dashboard = document.getElementById("dashboard");
  dashboard.innerHTML = "";

  if(Object.keys(GLOBAL_DATA).length === 0){
    dashboard.innerHTML = `<div class="empty-state">
      <div class="big">No tickets loaded yet</div>
      Sync the mapping, then paste or upload the ticket export to build the board.
    </div>`;
    return;
  }

  // ---- overall KPIs ----
  let total=0, reached=0, nr=0, agentCount=0;
  let maxCell = 1;

  for(const g in GLOBAL_DATA){
    for(const l in GLOBAL_DATA[g]){
      for(const a in GLOBAL_DATA[g][l]){
        const d = GLOBAL_DATA[g][l][a];
        total += d.total; reached += d.reached; nr += d.notReached;
        agentCount++;
        GLOBAL_HOURS.forEach(h => { if((d.hours[h]||0) > maxCell) maxCell = d.hours[h]; });
      }
    }
  }

  const reach = reachPct(reached, nr);
  const prod = (total/(GLOBAL_HOURS.length||1)).toFixed(1);
  const avg = (total/agentCount || 0).toFixed(1);

  dashboard.innerHTML += `
  <div class="readout">
    <div class="cell"><div class="num">${total}</div><div class="label">Total tickets</div></div>
    <div class="cell"><div class="num">${reach}%</div><div class="label">Reachability</div></div>
    <div class="cell"><div class="num">${prod}</div><div class="label">Productivity / hour</div></div>
    <div class="cell"><div class="num">${avg}</div><div class="label">Avg tickets / agent</div></div>
  </div>`;

  // ---- group summary table ----
  const groupNames = Object.keys(GLOBAL_DATA).sort((a,b)=>{
    return aggregate(flattenGroup(GLOBAL_DATA[b])).total - aggregate(flattenGroup(GLOBAL_DATA[a])).total;
  });

  let summary = `<div class="table-wrap"><table class="group-summary"><tr>
    <th>Task group</th><th>Total</th><th>Reach</th><th>Leaders</th><th>Agents</th><th>Points</th></tr>`;

  groupNames.forEach(g=>{
    const flat = flattenGroup(GLOBAL_DATA[g]);
    const agg = aggregate(flat);
    const leaderCount = Object.keys(GLOBAL_DATA[g]).length;
    const agentCountG = Object.keys(flat).length;
    summary += `<tr>
      <td class="name-cell"><span class="swatch" style="background:${groupColor(g)};color:${groupColor(g)}"></span>${g}</td>
      <td>${agg.total}</td>
      <td>${reachPct(agg.reached, agg.notReached)}%</td>
      <td>${leaderCount}</td>
      <td>${agentCountG}</td>
      <td>${agg.points.toFixed(1)}</td>
    </tr>`;
  });
  summary += `</table></div>`;
  dashboard.innerHTML += summary;

  // ---- group accordions ----
  groupNames.forEach(g=>{

    const leaders = GLOBAL_DATA[g];
    const flat = flattenGroup(leaders);
    const agg = aggregate(flat);
    const color = groupColor(g);

    const hasMatch = !search || Object.keys(flat).some(a => a.toLowerCase().includes(search));
    if(!hasMatch) return;

    const groupEl = document.createElement('details');
    groupEl.className = 'group';
    groupEl.style.borderLeftColor = color;
    groupEl.open = !!search;

    groupEl.innerHTML = `<summary>
        <span class="swatch" style="background:${color};color:${color}"></span>${g}
        <span class="meta">
          <span>${agg.total} tickets</span>
          <span>${reachPct(agg.reached, agg.notReached)}% reach</span>
          <span>${Object.keys(leaders).length} leaders</span>
        </span>
      </summary>`;

    const body = document.createElement('div');
    body.className = 'group-body';

    const leaderNames = Object.keys(leaders).sort((a,b)=>{
      return aggregate(leaders[b]).total - aggregate(leaders[a]).total;
    });

    let topLeader = null, topLeaderPts = -1;
    leaderNames.forEach(l=>{
      const p = aggregate(leaders[l]).points;
      if(p > topLeaderPts){ topLeaderPts = p; topLeader = l; }
    });

    leaderNames.forEach(l=>{

      const agents = leaders[l];
      const agentIds = Object.keys(agents).filter(a => !search || a.toLowerCase().includes(search));
      if(search && agentIds.length === 0) return;

      const lAgg = aggregate(agents);

      const leaderEl = document.createElement('details');
      leaderEl.className = 'leader';
      leaderEl.open = !!search;

      leaderEl.innerHTML = `<summary>
          ${l === topLeader ? '<span class="crown">👑</span>' : ''}
          ${l}
          <span class="lmeta">
            <span>${lAgg.total} tickets</span>
            <span>${reachPct(lAgg.reached, lAgg.notReached)}% reach</span>
            <span>${lAgg.points.toFixed(1)} pts</span>
            <span>${Object.keys(agents).length} agents</span>
          </span>
        </summary>`;

      const wrap = document.createElement('div');
      wrap.className = 'agents-wrap';

      const table = document.createElement('table');
      table.className = 'agents';

      let head = `<tr><th>Agent</th>`;
      GLOBAL_HOURS.forEach(h => head += `<th>${h}:00</th>`);
      head += `<th>Total</th><th>Points</th><th>Reach %</th></tr>`;
      table.innerHTML = head;

      const sortedAgents = agentIds.sort((a,b) => agents[b].total - agents[a].total);

      sortedAgents.forEach(a=>{
        const u = agents[a];
        const userReach = reachPct(u.reached, u.notReached);
        const reachClass = (u.reached + u.notReached === 0) ? '' : (userReach >= 60 ? 'reach-good' : 'reach-bad');

        let row = `<tr><td>${a}${COOR.includes(a) ? ' <span class="badge">COOR</span>' : ''}</td>`;

        GLOBAL_HOURS.forEach(h=>{
          const v = u.hours[h] || 0;
          const alpha = v === 0 ? 0 : 0.14 + 0.62 * (v / maxCell);
          const hot = alpha > 0.5;
          row += `<td class="hour-cell${hot?' hot':''}" style="background:rgba(45,214,196,${alpha})">${v||''}</td>`;
        });

        row += `<td class="total">${u.total}</td>`;
        row += `<td class="points">${u.points.toFixed(1)}</td>`;
        row += `<td class="${reachClass}">${userReach}%</td></tr>`;

        table.innerHTML += row;
      });

      wrap.appendChild(table);
      leaderEl.appendChild(wrap);
      body.appendChild(leaderEl);
    });

    groupEl.appendChild(body);
    dashboard.appendChild(groupEl);
  });
}

}
